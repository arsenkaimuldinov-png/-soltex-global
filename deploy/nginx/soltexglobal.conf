# soltexglobal.co — public site host (Phase I-2; approved architecture §11, docs/deployment.md).
#
#   1. An existing static page of the ACTIVE release is served directly (API not involved).
#   2. Otherwise @lookup asks the API (loopback, 1 s connect / 2 s read) whether the path is an
#      old address: 301/302 with Location = https://soltexglobal.co + internal path.
#   3. Anything else — unknown path, API down, slow, 5xx, rate limit — is a REAL 404 with the
#      localized not-found page of the build (/ru/… → /ru/404.html). Never a 502.
#
# Install: copy to /etc/nginx/sites-available/, adjust the certificate paths, link into
# sites-enabled, `nginx -t && systemctl reload nginx`. The http-level directives (limit_req_zone,
# map, upstream) must be in the http context, which is where sites-enabled/* is included.
# Tested by apps/api/test/nginx.db.test.ts (the test swaps the lines between the `# >>>` / `# <<<`
# markers and the root / upstream values for local ones).

limit_req_zone $binary_remote_addr zone=soltex_lookup:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=soltex_leads:10m rate=10r/m;

# Language of an unknown path → its 404 page (from the request as sent: $uri is rewritten in @lookup).
map $request_uri $soltex_not_found {
  default                         /404.html;
  ~^/(?<l>ru|zh|tr|ar|es)([/?]|$) /$l/404.html;
}

map $uri $soltex_cache_control {
  default             "no-cache";
  ~^/assets/          "public, max-age=31536000, immutable";
  ~^/media/(originals|variants)/ "public, max-age=31536000, immutable";
  ~^/(images|videos)/ "public, max-age=2592000";
}

upstream soltex_api {
  server 127.0.0.1:3100;
  keepalive 8;
}

server {
  # >>> tls
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/letsencrypt/live/soltexglobal.co/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/soltexglobal.co/privkey.pem;
  # Mozilla "intermediate" (Phase M-1, ASVS §9.1): TLS 1.2 and 1.3 only, the clients choose ciphers.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SoltexSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # <<< tls
  server_name soltexglobal.co;

  # `current` is the symlink the publishing system switches (docs/admin-publishing.md).
  root /srv/soltex/current;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  add_header Cache-Control $soltex_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # Content Security Policy (Phase M-1, review §Q): the text of SITE_CSP in
  # packages/core/src/domain/site-security.ts. The one inline script (the motion boot script of
  # apps/web/index.html) is allowed by its hash; scripts/check-site-csp.mjs (npm run lint) fails when
  # the script, this line and SITE_CSP disagree.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-FxjS9LAg+aftdgj8JMq5VioItakbndiIAdl0ujkCkNc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;

  # Static first: /company → company.html, /ru → ru.html, / → index.html.
  location / {
    try_files $uri $uri.html $uri/index.html @lookup;
  }

  # A trailing slash never serves a directory listing, a 403 or duplicate content: 301 to the
  # address without the slash when that page exists, else the lookup (old addresses).
  location ~ ^(?<soltex_bare>.+)/$ {
    if (-f $document_root$soltex_bare.html) {
      return 301 https://soltexglobal.co$soltex_bare$is_args$args;
    }
    try_files $uri/index.html @lookup;
  }

  location @lookup {
    limit_req zone=soltex_lookup burst=40 nodelay;

    # $uri: decoded and normalized by nginx ("..", "//" resolved). The API re-checks it (§11.2).
    set $soltex_lookup_path $uri;
    # Decoded control characters (%0d%0a…) would split the header sent to the API: refuse them here.
    if ($soltex_lookup_path ~ "[\x00-\x1f\x7f]") {
      return 404;
    }
    rewrite ^ /internal/v1/redirect break;
    proxy_pass http://soltex_api;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_set_header X-Lookup-Path $soltex_lookup_path;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
    proxy_redirect off;

    proxy_intercept_errors on;
    error_page 404 429 500 502 503 504 =404 $soltex_not_found;
  }

  # Media library (Phase J): uploaded files live outside the releases, under UUID names that never
  # change (a replacement is a new file), so they are cached for a year. Only originals/ is public.
  location /media/originals/ {
    alias /srv/soltex/media/originals/;
    types {
      image/jpeg jpg;
      image/png  png;
      image/webp webp;
      image/avif avif;
      video/mp4  mp4;
    }
    default_type application/octet-stream;
    error_page 404 =404 /404.html;
  }
  # Responsive copies (Phase J-2): WebP only, immutable paths.
  location /media/variants/ {
    alias /srv/soltex/media/variants/;
    types { image/webp webp; }
    default_type application/octet-stream;
    error_page 404 =404 /404.html;
  }

  # The forms of the site (Phase K): the only API route on this host (approved §10: explicit
  # allowlist). The API checks the header, the origin, the size and its own per-IP limit again.
  location = /api/v1/public/leads {
    limit_req zone=soltex_leads burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 32k;
    proxy_pass http://soltex_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
  }

  # Only the 404 pages themselves are reachable as error targets; direct requests are fine too.
  location ~ ^/((ru|zh|tr|ar|es)/)?404\.html$ {
    try_files $uri =404;
  }
}

# >>> host-redirects
server {
  listen 80;
  listen [::]:80;
  server_name soltexglobal.co www.soltexglobal.co;
  server_tokens off;
  # Let's Encrypt renewals (certbot --webroot -w /var/www/letsencrypt; docs/deploy-runbook-ru.md).
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://soltexglobal.co$request_uri;
  }
}
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.soltexglobal.co;
  ssl_certificate     /etc/letsencrypt/live/soltexglobal.co/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/soltexglobal.co/privkey.pem;
  return 301 https://soltexglobal.co$request_uri;
}
# <<< host-redirects
