# preview.soltexglobal.co — preview of release candidates (Phase N-0; docs/admin-publishing.md §4).
#
# Everything goes to the preview server (127.0.0.1:3102, `npm run preview-server -w @soltex/api`):
# it sends its own security headers (CSP, X-Robots-Tag: noindex, no-store, X-Frame-Options), checks
# the one-time token and the session cookie, and serves only the requested release.
# Install: copy to /etc/nginx/sites-available/, link into sites-enabled, `nginx -t && systemctl reload nginx`.

server {
  # >>> tls
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/letsencrypt/live/preview.soltexglobal.co/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.soltexglobal.co/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SoltexPreviewSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # <<< tls
  server_name preview.soltexglobal.co;
  server_tokens off;

  # Releases can contain large videos; uploads never go here.
  client_max_body_size 1m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:3102;
  }
}

# >>> host-redirects
server {
  listen 80;
  listen [::]:80;
  server_name preview.soltexglobal.co;
  server_tokens off;
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://preview.soltexglobal.co$request_uri;
  }
}
# <<< host-redirects
