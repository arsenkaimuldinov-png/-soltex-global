# admin.soltexglobal.co — admin SPA + API on one origin (Phase N-0; approved architecture §10,
# docs/admin-ui.md §8, docs/deploy-runbook-ru.md).
#
#   /            the built admin (apps/admin/dist, copied to /srv/soltex/admin by deploy/scripts/update.sh);
#                unknown paths → index.html (client-side routes)
#   /api/        the API on 127.0.0.1:3100 (no CORS: same origin)
#   /internal/   never exposed (nginx @lookup of the public site only)
#
# Requires soltexglobal.conf in sites-enabled too (it defines `upstream soltex_api`).
# Install: copy to /etc/nginx/sites-available/, link into sites-enabled, `nginx -t && systemctl reload nginx`.

limit_req_zone $binary_remote_addr zone=soltex_admin_api:10m rate=30r/s;

server {
  # >>> tls
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  ssl_certificate     /etc/letsencrypt/live/admin.soltexglobal.co/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.soltexglobal.co/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SoltexAdminSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # <<< tls
  server_name admin.soltexglobal.co;

  root /srv/soltex/admin;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  # The admin is never indexed and never framed (docs/admin-ui.md §8: ADMIN_CSP in apps/admin/vite.config.ts).
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri =404;
  }

  # Client-side routes: every other path is the SPA (never cached, so a new build is picked up).
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    try_files $uri /index.html;
  }

  location /api/ {
    limit_req zone=soltex_admin_api burst=60 nodelay;
    limit_req_status 429;
    # Media uploads: images ≤ 20 MB, video ≤ 200 MB (the API checks the exact limits); streamed.
    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The API trusts X-Forwarded-For only from 127.0.0.1 (app.ts trustProxy).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://soltex_api;
  }

  location /internal/ {
    return 404;
  }
}

# >>> host-redirects
server {
  listen 80;
  listen [::]:80;
  server_name admin.soltexglobal.co;
  server_tokens off;
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }
  location / {
    return 301 https://admin.soltexglobal.co$request_uri;
  }
}
# <<< host-redirects
