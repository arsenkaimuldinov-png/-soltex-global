# ---------------------------------------------------------------------------
# TEMPORARY DEMO / CLIENT-PREVIEW HOSTING ONLY.
# The production site will be served by Host.KZ (see docs/deployment.md). Nothing in the
# application depends on Netlify; this file only tells Netlify how to build and serve dist/.
# ---------------------------------------------------------------------------
[build]
  command = "npm run build"
  publish = "dist"

# Every public page is a prerendered file (dist/company.html, dist/ru/company.html, …), which
# Netlify serves for "/company", "/ru/company". There is deliberately NO "/* → /index.html 200"
# SPA fallback: unknown URLs get a real HTTP 404 with the page of their language.
# (Netlify serves dist/404.html for unmatched English URLs automatically.)
[[redirects]]
  from = "/ru/*"
  to = "/ru/404.html"
  status = 404

[[redirects]]
  from = "/zh/*"
  to = "/zh/404.html"
  status = 404

[[redirects]]
  from = "/tr/*"
  to = "/tr/404.html"
  status = 404

[[redirects]]
  from = "/ar/*"
  to = "/ar/404.html"
  status = 404

[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404
